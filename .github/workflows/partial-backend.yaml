name: Go Build/Test

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

on:
  workflow_call:

jobs:
  Go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.mod

      # GitHub's release downloads sometimes answer 504, so try once more before failing the job.
      - name: Install Task
        id: install-task
        continue-on-error: true
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Task (retry)
        if: steps.install-task.outcome == 'failure'
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The action downloads golangci-lint from GitHub's releases, which sometimes answer 504.
      # A real lint failure fails the retry too, so it still fails the job.
      - name: golangci-lint
        id: golangci-lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20
        with:
          # Optional: version of golangci-lint to use in form of v1.2 or v1.2.3 or `latest` to use the latest version
          version: latest

          # Optional: working directory, useful for monorepos
          working-directory: backend
          args: --timeout=6m

      - name: golangci-lint (retry)
        if: steps.golangci-lint.outcome == 'failure'
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20
        with:
          version: latest
          working-directory: backend
          args: --timeout=6m

      - name: Build API
        run: task go:build

      - name: Test
        run: task go:coverage
