# Builds the akempkens/homebox image and publishes it to GitHub Container
# Registry (ghcr.io) under this repository, for the Synology deployment.
#
# Upstream's docker-publish*.yaml workflows stay disabled in this fork (GitHub
# disables scheduled workflows in forks: "disabled_fork"); this file is
# fork-only, so it never conflicts with upstream syncs.
#
# Images are only built when a release tag is pushed or the workflow is run by
# hand, so pull requests and merges to main never build one (saves CI minutes):
#
#   push tag v*.*.*   -> release, e.g. v0.27.0-ak.2: :0.27.0-ak.2, :latest, :sha-<short>
#   manual run        -> :<branch-name> (Actions tab -> Run workflow); use this to
#                        check a Dockerfile change on a branch before merging it
name: AK Docker publish

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  GHCR_REPO: ghcr.io/${{ github.repository }} # ghcr.io/akempkens/homebox

# A newer push to the same branch cancels the older, now-pointless build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # lets the built-in GITHUB_TOKEN push to ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.GHCR_REPO }}
          # Releases here are tagged vX.Y.Z-ak.N, which semver counts as pre-releases,
          # so metadata-action would never move :latest on its own. Every pushed
          # v* tag is a release in this repo, so set :latest explicitly.
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build info
        id: info
        run: |
          echo "now=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64 # Synology is x86_64; add linux/arm64 here (plus a QEMU step) if that changes
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Shown in the app footer. A release tag (v1.2.3) reads as a version;
          # anything else (a manual run on a branch) has no dot, which the app treats as a
          # dev build and skips the "new version available" prompt.
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.info.outputs.short_sha }}
            BUILD_TIME=${{ steps.info.outputs.now }}
          # Plain single-platform manifest; provenance attestations turn it into an
          # index with an "unknown/unknown" entry that older Docker builds handle poorly.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
