services:
  homebox:
    image: homebox
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - COMMIT=head
        - BUILD_TIME=0001-01-01T00:00:00Z
      x-bake:
        platforms:
            - linux/amd64
            - linux/arm64
            - linux/arm
    environment:
      - HBOX_LOG_LEVEL=-1
      - HBOX_AUTH_API_KEY_PEPPER=dev-only-pepper-not-for-production-use-32b+
    ports:
      - 3100:7745
