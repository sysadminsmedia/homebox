<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="system-ui,sans-serif" font-size="13"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666"/></marker></defs><rect width="900" height="420" fill="#fff" rx="8"/><text x="20" y="28" font-weight="700" font-size="15" fill="#333">Scheduled backup run (per destination)</text><rect x="20" y="60" width="120" height="50" rx="8" fill="#eaf3ec" stroke="#5f8f6d" stroke-width="1.5"/><text x="80.0" y="81.0" text-anchor="middle" fill="#2d4a36" font-weight="600">Schedule tick</text><text x="80.0" y="97.0" text-anchor="middle" fill="#2d4a36" font-size="11">cron / interval</text><line x1="140" y1="85" x2="180" y2="85" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><rect x="180" y="60" width="150" height="50" rx="8" fill="#eaf3ec" stroke="#5f8f6d" stroke-width="1.5"/><text x="255.0" y="81.0" text-anchor="middle" fill="#2d4a36" font-weight="600">Changes since last</text><text x="255.0" y="97.0" text-anchor="middle" fill="#2d4a36" font-size="11">successful backup?</text><line x1="330" y1="85" x2="380" y2="85" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><text x="361.0" y="81.0" fill="#555" font-size="11">yes</text><rect x="380" y="60" width="130" height="50" rx="8" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/><text x="445.0" y="81.0" text-anchor="middle" fill="#444" font-weight="600">Export zip</text><text x="445.0" y="97.0" text-anchor="middle" fill="#444" font-size="11">existing pipeline</text><line x1="510" y1="85" x2="550" y2="85" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><rect x="550" y="60" width="130" height="50" rx="8" fill="#eaf3ec" stroke="#5f8f6d" stroke-width="1.5"/><text x="615.0" y="81.0" text-anchor="middle" fill="#2d4a36" font-weight="600">Upload to</text><text x="615.0" y="97.0" text-anchor="middle" fill="#2d4a36" font-size="11">destination</text><line x1="680" y1="85" x2="720" y2="85" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><rect x="720" y="60" width="160" height="50" rx="8" fill="#eaf3ec" stroke="#5f8f6d" stroke-width="1.5"/><text x="800.0" y="81.0" text-anchor="middle" fill="#2d4a36" font-weight="600">Verify + record run</text><text x="800.0" y="97.0" text-anchor="middle" fill="#2d4a36" font-size="11">completed</text><line x1="255" y1="110" x2="255" y2="170" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><text x="261.0" y="136.0" fill="#555" font-size="11">no</text><rect x="180" y="170" width="150" height="50" rx="8" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/><text x="255.0" y="191.0" text-anchor="middle" fill="#444" font-weight="600">Record “skipped”</text><text x="255.0" y="207.0" text-anchor="middle" fill="#444" font-size="11">no change</text><line x1="615" y1="110" x2="615" y2="170" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><text x="621.0" y="136.0" fill="#555" font-size="11">error</text><rect x="540" y="170" width="150" height="50" rx="8" fill="#fdecea" stroke="#d9534f" stroke-width="1.5"/><text x="615.0" y="191.0" text-anchor="middle" fill="#7a1f1b" font-weight="600">Mark run failed</text><text x="615.0" y="207.0" text-anchor="middle" fill="#7a1f1b" font-size="11">retry w/ backoff</text><line x1="690" y1="195" x2="715" y2="195" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><rect x="715" y="170" width="130" height="50" rx="8" fill="#fdecea" stroke="#d9534f" stroke-width="1.5"/><text x="780.0" y="191.0" text-anchor="middle" fill="#7a1f1b" font-weight="600">Raise alert</text><text x="780.0" y="207.0" text-anchor="middle" fill="#7a1f1b" font-size="11">banner + Notifiers</text><rect x="720" y="260" width="160" height="50" rx="8" fill="#eaf3ec" stroke="#5f8f6d" stroke-width="1.5"/><text x="800.0" y="281.0" text-anchor="middle" fill="#2d4a36" font-weight="600">Prune by retention</text><text x="800.0" y="297.0" text-anchor="middle" fill="#2d4a36" font-size="11">7d / 4w / 6m …</text><line x1="860" y1="110" x2="860" y2="260" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><text x="20" y="300" font-weight="700" fill="#333">Health check loop (independent, every N min)</text><rect x="20" y="320" width="150" height="50" rx="8" fill="#eaf3ec" stroke="#5f8f6d" stroke-width="1.5"/><text x="95.0" y="341.0" text-anchor="middle" fill="#2d4a36" font-weight="600">Check()</text><text x="95.0" y="357.0" text-anchor="middle" fill="#2d4a36" font-size="11">write+delete probe</text><line x1="170" y1="345" x2="215" y2="345" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><rect x="215" y="320" width="150" height="50" rx="8" fill="#eaf3ec" stroke="#5f8f6d" stroke-width="1.5"/><text x="290.0" y="350.0" text-anchor="middle" fill="#2d4a36" font-weight="600">Reachable?</text><line x1="365" y1="345" x2="410" y2="345" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><text x="393.5" y="341.0" fill="#555" font-size="11">no ×N</text><rect x="410" y="320" width="160" height="50" rx="8" fill="#fdecea" stroke="#d9534f" stroke-width="1.5"/><text x="490.0" y="341.0" text-anchor="middle" fill="#7a1f1b" font-weight="600">Mark Unreachable</text><text x="490.0" y="357.0" text-anchor="middle" fill="#7a1f1b" font-size="11">alert once (dedupe)</text><line x1="290" y1="370" x2="290" y2="395" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><text x="298" y="403" fill="#555" font-size="11">yes → Healthy (+ recovery notice if previously down)</text></svg>