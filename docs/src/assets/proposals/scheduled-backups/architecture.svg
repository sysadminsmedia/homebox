port pipeline</text><text x="420.0" y="245.0" text-anchor="middle" fill="#444" font-size="11">ExportService · pubsub job (zip)</text><line x1="420" y1="170" x2="420" y2="205" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><rect x="620" y="60" width="250" height="56" rx="8" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/><text x="745.0" y="84.0" text-anchor="middle" fill="#444" font-weight="600">Notifiers (Shoutrrr)</text><text x="745.0" y="100.0" text-anchor="middle" fill="#444" font-size="11">email · push · Discord …</text><line x1="550" y1="95" x2="620" y2="90" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><text x="591.0" y="88.5" fill="#555" font-size="11">alerts</text><rect x="620" y="150" width="250" height="56" rx="8" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/><text x="745.0" y="174.0" text-anchor="middle" fill="#444" font-weight="600">In-app banner / SSE</text><text x="745.0" y="190.0" text-anchor="middle" fill="#444" font-size="11">existing ServerEvent bus</text><line x1="550" y1="130" x2="620" y2="170" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><rect x="290" y="310" width="260" height="56" rx="8" fill="#eaf3ec" stroke="#5f8f6d" stroke-width="1.5"/><text x="420.0" y="334.0" text-anchor="middle" fill="#2d4a36" font-weight="600">Destination interface</text><text x="420.0" y="350.0" text-anchor="middle" fill="#2d4a36" font-size="11">Put · List · Open · Delete · Check</text><line x1="420" y1="261" x2="420" y2="310" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="310" width="200" height="56" rx="8" fill="#eaf3ec" stroke="#5f8f6d" stroke-width="1.5"/><text x="130.0" y="334.0" text-anchor="middle" fill="#2d4a36" font-weight="600">Backup metadata (DB)</text><text x="130.0" y="350.0" text-anchor="middle" fill="#2d4a36" font-size="11">schedules · destinations · runs</text><line x1="290" y1="338" x2="230" y2="338" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="430" width="150" height="56