<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="system-ui,sans-serif" font-size="13"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666"/></marker></defs><rect width="900" height="360" fill="#fff" rx="8"/><text x="20" y="28" font-weight="700" font-size="15" fill="#333">OIDC-assisted cloud destination (optional offer)</text><rect x="20" y="50" width="170" height="36" rx="8" fill="#eaf3ec" stroke="#5f8f6d" stroke-width="1.5"/><text x="105.0" y="73.0" text-anchor="middle" fill="#2d4a36" font-weight="600">User</text><line x1="105" y1="86" x2="105" y2="340" stroke="#cfcfcf" stroke-dasharray="4 4"/><rect x="250" y="50" width="170" height="36" rx="8" fill="#eaf3ec" stroke="#5f8f6d" stroke-width="1.5"/><text x="335.0" y="73.0" text-anchor="middle" fill="#2d4a36" font-weight="600">Homebox</text><line x1="335" y1="86" x2="335" y2="340" stroke="#cfcfcf" stroke-dasharray="4 4"/><rect x="480" y="50" width="170" height="36" rx="8" fill="#fff" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/><text x="565.0" y="73.0" text-anchor="middle" fill="#444" font-weight="600">OIDC provider</text><line x1="565" y1="86" x2="565" y2="340" stroke="#cfcfcf" stroke-dasharray="4 4"/><rect x="710" y="50" width="170" height="36" rx="8" fill="#fff" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/><text x="795.0" y="73.0" text-anchor="middle" fill="#444" font-weight="600">Cloud storage API</text><line x1="795" y1="86" x2="795" y2="340" stroke="#cfcfcf" stroke-dasharray="4 4"/><text x="480" y="104" font-size="11" fill="#555">(Google / Microsoft only)</text><line x1="105" y1="130" x2="335" y2="130" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><text x="113" y="124" font-size="11" fill="#444">1. Sign in with OIDC (already supported)</text><line x1="335" y1="170" x2="105" y2="170" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><text x="113" y="164" font-size="11" fill="#444">2. Issuer is Google/Microsoft? → show “Use Drive” offer</text><line x1="105" y1="210" x2="335" y2="210" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><text x="113" y="204" font-size="11" fill="#444">3. User accepts (or declines / picks another)</text><line x1="335" y1="250" x2="565" y2="250" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><text x="343" y="244" font-size="11" fill="#444">4. Re-consent: drive.file + offline_access</text><line x1="565" y1="290" x2="335" y2="290" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><text x="343" y="284" font-size="11" fill="#444">5. Refresh token → store encrypted</text><line x1="335" y1="325" x2="795" y2="325" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/><text x="343" y="319" font-size="11" fill="#444">6. Create folder, test write, health check</text></svg>